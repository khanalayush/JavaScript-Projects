<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/dist/tailwind.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .forecast:hover {
        transform: translateY(-3px);
        border-color: rgba(129, 140, 248, 0.4);
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="grid grid-rows-[10vh_90vh] grid-cols-1">
      <!-- header -->
      <header
        class="bg-linear-to-r from-indigo-900 to-slate-800 font-bold px-4 flex sm:px-6 py-3 items-center gap-2"
      >
        <span class="text-xl">⛅</span>
        <h1 class="font-display font-bold text-lg sm:text-xl tracking-wide">
          Weather Dashboard
        </h1>
      </header>

      <!-- main layout -->
      <main class="grid grid-cols-1 lg:grid-cols-[320px_1fr]">
        <!-- left panel: Search -->
        <section class="flex flex-col gap-3 m-5">
          <div
            class="bg-slate-800 border border-white/10 rounded-2xl p-4 flex flex-col gap-3"
          >
            <div class="flex flex-col gap-1.5">
              <label
                class="text-xs font-semibold uppercase tracking-widest text-slate-400"
                >City Name</label
              >
              <div class="relative">
                <svg
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"
                  width="15"
                  height="15"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="M21 21l-4.35-4.35" />
                </svg>
                <input
                  id="cityInput"
                  type="text"
                  placeholder="E.g. Kathmandu, Pokhara..."
                  class="bg-slate-700/60 w-full rounded-xl pl-9 pr-3 py-3 border border-white/20 text-slate-100 text-sm placeholder-slate-500 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400/40 transition"
                />
              </div>
            </div>
            <button
              id="searchBtn"
              class="flex justify-center items-center gap-2 bg-indigo-600 w-full rounded-xl py-2.5 text-sm text-white font-semibold hover:bg-indigo-500 cursor-pointer transition"
            >
              <svg
                width="14"
                height="14"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
              </svg>
              Search
            </button>
          </div>
          <div
            class="flex items-center text-gray-500 font-semibold text-sm w-full"
          >
            <div class="flex-1 border-t border-gray-400"></div>
            <span class="px-2">or</span>
            <div class="flex-1 border-t border-gray-400"></div>
          </div>
          <button
            id="current_Location"
            class="flex justify-center items-center gap-2 bg-slate-800 py-3 border border-white/20 w-full rounded-xl font-semibold hover:bg-slate-700 transition text-sm cursor-pointer"
          >
            <svg
              width="15"
              height="15"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"
              />
            </svg>
            Use Current Location
          </button>
        </section>

        <!-- right panel: Forecast -->
        <section class="flex flex-col gap-3 m-5">
          <div
            id="today"
            class="flex justify-center items-center bg-linear-to-r from-violet-900 via-violet-800 to-slate-800 h-[30vh] w-full rounded-2xl mb-5 p-5"
          >
            <div class="text-center text-slate-400 text-sm">
              <div class="text-4xl mb-2">🌤️</div>
              <p>
                Search for a city or use your location <br />
                to see the weather forecast.
              </p>
            </div>
          </div>

          <div>
            <h2 class="font-bold text-xl">4-Day Forecast</h2>
            <div
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-5"
            >
              <!-- 4 days forecast appear here-->
              <div
                class="forecast bg-slate-800 rounded-2xl border border-white/10 min-h-[35vh] p-3 text-slate-400 flex justify-center items-center"
              >
                __
              </div>
              <div
                class="forecast bg-slate-800 rounded-2xl min-h-[35vh] p-3 text-slate-400 border border-white/10 flex justify-center items-center"
              >
                __
              </div>
              <div
                class="forecast bg-slate-800 rounded-2xl min-h-[35vh] p-3 text-slate-400 border border-white/10 flex justify-center items-center"
              >
                __
              </div>
              <div
                class="forecast bg-slate-800 rounded-2xl min-h-[35vh] p-3 text-slate-400 border border-white/10 flex justify-center items-center"
              >
                __
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
