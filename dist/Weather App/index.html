<html lang="en">
<head>

    <title>Weather App</title>
</head>
<body>
    <div class="weatherContainer">
        <!-- header -->
        <header>Weather Dashboard</header>

        <!-- main layout -->
        <main>
            <!-- left panel: Search -->
            <section>
                <input type="text" placeholder="Enter city name" name="" id="">
                <button>Search</button>
                <button>Use Current Location</button>
            </section>

            <!-- right panel: Forecast -->
            <section>
                <h2>Today's Forecast</h2>
                <div>
                    <!-- today's forecast appear here -->
                </div>
                <h3>4 Day Forecast</h3>
                <div>
                    <!-- 4 days forecast appear here-->
                </div>
            </section>
        </main>
    </div>
</body>
</html>
